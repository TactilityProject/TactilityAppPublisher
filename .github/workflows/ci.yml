name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Check the workflows and actions
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, yaml
          files = glob.glob('.github/**/*.yml', recursive=True)
          for file in files:
              yaml.safe_load(open(file))
          print(f"Parsed {len(files)} files")
          PY
