name: Publish to an S3 compatible bucket

inputs:
  sdk_version:
    description: The SDK version, which is a path segment in the bucket
    required: true
  bucket:
    description: The bucket
    required: false
    default: tactility
  prefix:
    description: The folder in the bucket
    required: false
    default: apps
  endpoint_url:
    description: The endpoint of the service. Empty uses the R2 endpoint of cdn_id, or else AWS S3.
    required: false
    default: ''
  region:
    description: The region of the bucket
    required: false
    default: auto
  access_key_id:
    description: The access key id
    required: true
  secret_access_key:
    description: The secret access key
    required: true
  cdn_id:
    description: The Cloudflare account id, for the R2 endpoint when there is no endpoint_url
    required: false
    default: ''
  cdn_base_url:
    description: The address that the CDN serves the bucket at, for purging its cache
    required: false
    default: https://cdn.tactilityproject.org
  cloudflare_zone_id:
    description: The Cloudflare zone of the CDN. Without it the cache isn't purged.
    required: false
    default: ''
  cloudflare_purge_cache_token:
    description: A Cloudflare API token with the Cache Purge permission. Without it the cache isn't purged.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: 'Download release files'
      uses: actions/download-artifact@v4
      with:
        name: 'release-files'
        path: release_files
    - name: 'Install boto3'
      shell: bash
      run: pip install boto3
    - name: 'Upload files'
      shell: bash
      env:
        S3_ACCESS_KEY_ID: ${{ inputs.access_key_id }}
        S3_SECRET_ACCESS_KEY: ${{ inputs.secret_access_key }}
        CDN_ID: ${{ inputs.cdn_id }}
      run: python "${{ github.action_path }}/../../../apppublisher.py" publish s3 release_files --sdk "${{ inputs.sdk_version }}" --bucket "${{ inputs.bucket }}" --prefix "${{ inputs.prefix }}" --region "${{ inputs.region }}" ${{ inputs.endpoint_url != '' && format('--endpoint-url "{0}"', inputs.endpoint_url) || '' }}
    # Never fails the job: without the token or on an API error, the files refresh when their cache expires
    - name: 'Purge CDN cache'
      shell: bash
      env:
        CLOUDFLARE_ZONE_ID: ${{ inputs.cloudflare_zone_id }}
        CLOUDFLARE_PURGE_CACHE_TOKEN: ${{ inputs.cloudflare_purge_cache_token }}
      run: python "${{ github.action_path }}/../../../apppublisher.py" purge-cache release_files --sdk "${{ inputs.sdk_version }}" --prefix "${{ inputs.prefix }}" --base-url "${{ inputs.cdn_base_url }}" || true
