name: Build app

inputs:
  app_name:
    description: The name of the app folder
    required: true
  apps_dir:
    description: The folder of the apps, relative to the root of the repository
    required: false
    default: Apps
  tt_path:
    description: The tt.py of the project, relative to the apps folder's parent (the repository root)
    required: false
    default: tt.py
  esp_idf_version:
    description: The ESP-IDF version to build with
    required: false
    default: v6.1
  save_cache:
    description: Save the ESP-IDF/SDK compiler cache after building (one job per run should do this)
    required: false
    default: 'false'
  upload_artifact:
    description: Upload the built app as a workflow artifact (artifact names must be unique per run)
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # After checkout, which cleans the workspace. The SDK compiles its ESP-IDF/SDK parts through
    # ccache, in .ccache/<platform>. The newest cache of any earlier run is restored.
    - name: 'Restore compiler cache'
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ccache-idf-${{ inputs.esp_idf_version }}-${{ github.run_id }}
        restore-keys: ccache-idf-${{ inputs.esp_idf_version }}-
    - name: 'Build'
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ inputs.esp_idf_version }}
        path: .
        # The export reset prevents an error when building other targets
        # The default environment variable is set to "esp32" by the GitHub Action
        # tt runs in the app's folder, so it uses the SDK version of this app's manifest
        # TACTILITY_CCACHE_DIR points the SDK's compiler cache into the workspace, so it can be cached
        command: 'export IDF_TARGET= && export TACTILITY_CCACHE_DIR="$(pwd)/.ccache" && root="$(pwd)" && cd ${{ inputs.apps_dir }}/${{ inputs.app_name }} && python "$root/${{ inputs.tt_path }}" app build && (for d in "$TACTILITY_CCACHE_DIR"/*/; do [ -d "$d" ] && echo "ccache $d" && ccache -d "$d" -s; done; true)'
    - name: 'Save compiler cache'
      if: inputs.save_cache == 'true'
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ccache-idf-${{ inputs.esp_idf_version }}-${{ github.run_id }}
    - name: 'Upload Artifact'
      if: inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.app_name }}
        # The built package is named after the app's manifest id (e.g. tactility.helloworld),
        # not the app folder name, so this is a glob
        path: ${{ inputs.apps_dir }}/${{ inputs.app_name }}/build/*.app
        retention-days: 30
